spring.application.name=server
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/dogsout
spring.datasource.username=moritzdavinghausen
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production!!}
jwt.expiration=86400000

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Apple Sign-In
apple.client-id=${APPLE_CLIENT_ID:}

# Google Places (park search proxy) — key stays server-side, never in the app
google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# Mail (Resend HTTPS API — SMTP is blocked outbound on most PaaS hosts, Railway included)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Moderation — user reports are mailed here
app.admin-email=${ADMIN_EMAIL:moritz.davinghausen@gmail.com}

# Public base URL this server is reachable at (used to build upload URLs)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Server
server.port=${PORT:8080}
server.error.include-message=always