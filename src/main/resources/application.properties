spring.application.name=server
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/dogsout
spring.datasource.username=moritzdavinghausen
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production!!}
jwt.expiration=86400000

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Apple Sign-In
apple.client-id=${APPLE_CLIENT_ID:}

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Moderation — user reports are mailed here
app.admin-email=${ADMIN_EMAIL:moritz.davinghausen@gmail.com}

# Server
server.port=8080
server.error.include-message=always