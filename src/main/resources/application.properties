spring.application.name=server
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/dogsout
spring.datasource.username=moritzdavinghausen
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production!!}
# 30 days. This used to be 24h with nothing to renew it, so every session died a
# day after sign-in and users were forced to log in again — the single most common
# complaint from the beta round. Sliding renewal below means an active user never
# reaches this; it is the inactivity cut-off.
jwt.expiration=${JWT_EXPIRATION:2592000000}
# Re-issue a token once it is older than this, on any authenticated request.
# An hour, not a day, for two reasons: signing is stateless and costs nothing, and
# tokens already in the wild still carry the old 24h expiry — a threshold shorter
# than that lifetime is what lets an existing session be renewed into a long one
# on the user's next visit, instead of dying once more first.
jwt.refresh-after=${JWT_REFRESH_AFTER:3600000}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Apple Sign-In
apple.client-id=${APPLE_CLIENT_ID:}

# Google Places (park search proxy) — key stays server-side, never in the app
google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# Mail (Resend HTTPS API — SMTP is blocked outbound on most PaaS hosts, Railway included)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Moderation — user reports are mailed here
app.admin-email=${ADMIN_EMAIL:moritz.davinghausen@gmail.com}

# Public base URL this server is reachable at (used to build upload URLs)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Photo storage
# "local" writes to upload.dir and serves it from /uploads/**; "s3" writes to any
# S3-compatible bucket (Cloudflare R2, AWS S3, Supabase). Switching is this flag plus
# a re-run of the migration, which re-uploads every photo to the configured backend.
photo.storage=${PHOTO_STORAGE:local}
upload.dir=${UPLOAD_DIR:uploads}

# Only read when photo.storage=s3. photo.public-base-url is where the bucket is
# publicly readable — a CDN or public bucket domain, not the S3 API endpoint.
photo.s3.bucket=${PHOTO_S3_BUCKET:}
photo.s3.endpoint=${PHOTO_S3_ENDPOINT:}
photo.s3.region=${PHOTO_S3_REGION:auto}
photo.s3.access-key=${PHOTO_S3_ACCESS_KEY:}
photo.s3.secret-key=${PHOTO_S3_SECRET_KEY:}
photo.public-base-url=${PHOTO_PUBLIC_BASE_URL:}

# One-shot backfill of the legacy inline-base64 rows. Off unless explicitly enabled.
photo.migrate=${PHOTO_MIGRATE:false}

# Uploads are resized client-side before sending, so anything much over a couple of
# MB is a client that skipped that step; ImageProcessor rejects oversized images too.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Server
server.port=${PORT:8080}
server.error.include-message=always